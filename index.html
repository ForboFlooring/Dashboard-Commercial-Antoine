<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Antoine</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<h1>Dashboard Commercial Antoine</h1>

<button onclick="testExcel()">
Lire Excel
</button>

<pre id="result"></pre>

<script>

async function testExcel(){

    try{

        const response =
            await fetch("data.xlsx");

        const data =
            await response.arrayBuffer();

     const workbook =
XLSX.read(data);

const sheet =
workbook.Sheets["Clients AAJ"];

const rows =
XLSX.utils.sheet_to_json(
    sheet,
    {header:1}
);

console.table(rows);

document.getElementById(
    "result"
).textContent =
JSON.stringify(
    rows.slice(0,10),
    null,
    2
)

    }

    catch(error){

        document.getElementById(
            "result"
        ).textContent =
        error;

    }

}

</script>

</body>
</html>
