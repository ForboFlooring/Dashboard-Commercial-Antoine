<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<h1>🚨 VERSION TEST 999 🚨</h1>
    
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body{
    font-family:Segoe UI, Arial, sans-serif;
    margin:20px;
    background:#f5f7fa;
}

h1{
    color:#0072CE;
}

button{
    background:#0072CE;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#005fb0;
}

pre{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    white-space:pre-wrap;
    overflow:auto;
    margin-top:20px;
}

</style>

</head>

<body>

<h1>📊 Dashboard Commercial Antoine</h1>

<button onclick="testExcel()">
Lire Excel
</button>

<pre id="result">
Clique sur "Lire Excel"
</pre>

<script>

async function testExcel(){

    try{

        const response = await fetch("data.xlsx");

        if(!response.ok){
            throw new Error(
                "Impossible de charger data.xlsx"
            );
        }

        const data =
            await response.arrayBuffer();

        const workbook =
    XLSX.read(data);

const sheet =
    workbook.Sheets["Clients AAJ"];

if(!sheet){
    throw new Error(
        "Onglet 'Clients AAJ' introuvable"
    );
}

const rows =
    XLSX.utils.sheet_to_json(
        sheet,
        {header:1}
    );

        console.table(rows);

        document.getElementById(
            "result"
        ).textContent =
        JSON.stringify(
            rows.slice(0,15),
            null,
            2
        );

    }

    catch(error){

        document.getElementById(
            "result"
        ).textContent =
        "ERREUR :\n\n" +
        error.message;

    }

}

</script>

</body>
</html>
